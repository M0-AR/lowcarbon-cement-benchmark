services:
  lab:
    build: .
    ports:
      - "8888:8888"
    volumes:
      - ./:/workspace
      - ./data:/workspace/data
      - ./benchmarks:/workspace/benchmarks
    command: jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --allow-root --NotebookApp.token=''
    environment:
      - PYTHONPATH=/workspace
